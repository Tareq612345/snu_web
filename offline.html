<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>أوفلاين - مسار</title>
    <link rel="manifest" href="./manifest.json" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        padding: 1rem;
      }

      .container {
        text-align: center;
        max-width: 400px;
      }

      .icon {
        font-size: 6rem;
        margin-bottom: 1.5rem;
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-10px);
        }
      }

      h1 {
        font-size: 1.75rem;
        margin-bottom: 0.75rem;
      }

      p {
        color: #94a3b8;
        margin-bottom: 2rem;
        line-height: 1.6;
      }

      .btn {
        display: inline-block;
        background: linear-gradient(135deg, #14b8a6, #06b6d4);
        color: white;
        padding: 0.875rem 2rem;
        border-radius: 9999px;
        text-decoration: none;
        font-weight: bold;
        transition:
          transform 0.3s,
          box-shadow 0.3s;
      }

      .btn:hover {
        transform: scale(1.05);
        box-shadow: 0 10px 40px rgba(20, 184, 166, 0.4);
      }

      .status {
        margin-top: 2rem;
        padding: 1rem;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 1rem;
        font-size: 0.875rem;
      }

      .status-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: #ef4444;
        border-radius: 50%;
        margin-left: 0.5rem;
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.5;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="icon">📡</div>
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>
        يبدو أنك فقدت الاتصال بالإنترنت. لا تقلق، يمكنك متابعة استخدام المحتوى
        المحفوظ، أو إعادة المحاولة عندما يعود الاتصال.
      </p>

      <button class="btn" onclick="location.reload()">🔄 إعادة المحاولة</button>

      <div class="status">
        <span class="status-dot"></span>
        <span>الحالة: غير متصل</span>
      </div>
    </div>

    <script>
      // التحقق من الاتصال
      window.addEventListener("online", () => {
        location.reload();
      });
    </script>
  </body>
</html>

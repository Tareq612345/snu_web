[build]
  base = "v2"
  command = "npm run test && npm run build"
  publish = "dist"
  # Exit 0 tells Netlify to cancel builds while Cloudflare migration is verified.
  # Remove this line to resume Netlify CI/CD.
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
